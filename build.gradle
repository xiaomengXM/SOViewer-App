buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.0.2"
    }
}

// 注意：依赖仓库统一由 settings.gradle 的 dependencyResolutionManagement 提供，
// 此处不再声明 allprojects.repositories，否则会与 FAIL_ON_PROJECT_REPOS 冲突。

task clean(type: Delete) {
    delete rootProject.buildDir
}